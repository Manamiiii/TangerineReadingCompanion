name: Validate web and optionally deploy Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check repository privacy
        run: npm run check:privacy

      - name: Test
        run: npm test

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Verify immutable desktop review in an isolated browser
        run: npm run review:verify -- --prepare

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-report
          path: artifacts/e2e/
          retention-days: 7
          if-no-files-found: ignore

      - name: Validate reading packages
        run: npm run check:packages

      - name: Build
        run: npm run build
        env:
          VITE_APP_BUILD: ${{ github.sha }}

      - name: Check whitespace errors
        run: git diff --check

      - name: Upload Pages artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
